<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>男児着画生成メーカー | F.O.KIDS Style</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style type="text/tailwindcss">
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .drop-zone {
      @apply border-2 border-dashed border-gray-300 rounded-2xl p-4 text-center hover:bg-indigo-50 hover:border-indigo-400 transition cursor-pointer bg-white relative overflow-hidden min-h-[140px] flex flex-col items-center justify-center;
      z-index: 10;
    }
    .drop-zone.drag-over {
      @apply border-indigo-600 bg-indigo-100 ring-4 ring-indigo-100 !important;
    }
    /* 枠の中の要素がドロップを邪魔しないように設定 */
    .drop-zone * {
      pointer-events: none;
    }
    .preview-img { 
      @apply absolute inset-0 w-full h-full object-contain p-2 bg-white;
      pointer-events: none;
    }
    .radio-group label {
      @apply border-2 border-gray-200 rounded-xl px-4 py-3 text-center cursor-pointer transition text-sm font-medium text-gray-700 bg-white hover:bg-gray-50;
      pointer-events: auto;
    }
    .radio-group input[type="radio"]:checked + label {
      @apply border-indigo-500 bg-indigo-50 text-indigo-700 font-bold;
    }
    button { pointer-events: auto !important; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 sm:p-8">
  <div class="max-w-5xl mx-auto">
    <header class="text-center mb-10">
      <h1 class="text-4xl font-black text-slate-800 tracking-tighter">男児着画生成メーカー</h1>
      <p class="text-slate-500 mt-2">4-6歳 (110cm) F.O.KIDS スタイル</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <div class="lg:col-span-5 space-y-6">
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-bold text-slate-800 mb-6 flex items-center">
            <span class="bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs mr-2 font-mono">1</span>
            アイテム選択
          </h2>
          <div class="grid grid-cols-1 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1 ml-1">🧢 帽子</label>
              <div id="dropZoneHat" class="drop-zone">
                <p class="text-xs text-slate-400">ドロップして追加</p>
                <input type="file" id="hatInput" class="hidden" accept="image/*">
                <img id="previewHat" class="preview-img hidden">
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1 ml-1">👕 トップス</label>
              <div id="dropZoneTop" class="drop-zone">
                <p class="text-xs text-slate-400">ドロップして追加</p>
                <input type="file" id="topInput" class="hidden" accept="image/*">
                <img id="previewTop" class="preview-img hidden">
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1 ml-1">👖 ボトムス</label>
              <div id="dropZoneBottom" class="drop-zone">
                <p class="text-xs text-slate-400">ドロップして追加</p>
                <input type="file" id="bottomInput" class="hidden" accept="image/*">
                <img id="previewBottom" class="preview-img hidden">
              </div>
            </div>
          </div>
          <div class="mt-8 pt-6 border-t border-slate-100">
            <button id="generateBtn" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold text-lg hover:bg-indigo-600 transition-all shadow-lg">
              着画を生成する
            </button>
          </div>
        </div>
      </div>
      <div class="lg:col-span-7">
        <div id="resultCard" class="bg-white p-2 rounded-3xl shadow-sm border border-slate-200 flex items-center justify-center min-h-[500px] relative overflow-hidden">
          <img id="resultImg" class="hidden w-full h-auto rounded-2xl">
          <div id="loading" class="hidden text-center"><p class="animate-pulse">生成中...</p></div>
          <p id="placeholder" class="text-slate-300">画像がここに表示されます</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = { hat: null, top: null, bottom: null };

    // 【重要】ブラウザ全体でのデフォルト挙動（画像を開く）を完全に殺す
    window.addEventListener("dragover", e => e.preventDefault(), false);
    window.addEventListener("drop", e => e.preventDefault(), false);

    function setupUpload(inputId, dropId, previewId, key) {
      const input = document.getElementById(inputId);
      const drop = document.getElementById(dropId);
      const preview = document.getElementById(previewId);

      const handleFile = (file) => {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          state[key] = e.target.result;
          preview.src = e.target.result;
          preview.classList.remove('hidden');
          drop.classList.add('border-indigo-400');
        };
        reader.readAsDataURL(file);
      };

      // クリック
      drop.addEventListener('click', (e) => {
        if (e.target === drop || drop.contains(e.target)) {
          input.click();
        }
      });
      input.addEventListener('change', e => handleFile(e.target.files[0]));

      // ドラッグ＆ドロップ（stopPropagationを追加して確実に制御）
      drop.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.stopPropagation();
        drop.classList.add('drag-over');
      });

      drop.addEventListener('dragleave', (e) => {
        e.preventDefault();
        e.stopPropagation();
        drop.classList.remove('drag-over');
      });

      drop.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        drop.classList.remove('drag-over');
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleFile(e.dataTransfer.files[0]);
        }
      });
    }

    setupUpload('hatInput', 'dropZoneHat', 'previewHat', 'hat');
    setupUpload('topInput', 'dropZoneTop', 'previewTop', 'top');
    setupUpload('bottomInput', 'dropZoneBottom', 'previewBottom', 'bottom');

    document.getElementById('generateBtn').onclick = async () => {
      // 既存の生成ロジック...
      alert("生成を開始します（APIとの通信を記述してください）");
    };
  </script>
</body>
</html>
