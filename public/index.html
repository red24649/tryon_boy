<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>男児着画生成メーカー | F.O.KIDS Style</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style type="text/tailwindcss">
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .drop-zone {
      @apply border-2 border-dashed border-gray-300 rounded-2xl p-4 text-center hover:bg-indigo-50 hover:border-indigo-400 transition cursor-pointer bg-white relative overflow-hidden min-h-[140px] flex flex-col items-center justify-center;
      z-index: 10;
    }
    .drop-zone.drag-over { @apply border-indigo-600 bg-indigo-100 ring-4 ring-indigo-100 !important; }
    .drop-zone * { pointer-events: none; }
    .preview-img { @apply absolute inset-0 w-full h-full object-contain p-2 bg-white; pointer-events: none; }
    
    .radio-group label {
      @apply border-2 border-gray-200 rounded-xl px-4 py-3 text-center cursor-pointer transition text-sm font-medium text-gray-700 bg-white hover:bg-gray-50;
      pointer-events: auto;
    }
    .radio-group input[type="radio"]:checked + label {
      @apply border-indigo-500 bg-indigo-50 text-indigo-700 font-bold;
    }
    
    /* ローディングアニメーションのカスタマイズ */
    .step-dot { @apply w-3 h-3 rounded-full bg-gray-200 transition-all duration-500; }
    .step-dot.active { @apply bg-indigo-500 scale-125 shadow-[0_0_10px_rgba(79,70,229,0.5)]; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 sm:p-8">
  <div class="max-w-5xl mx-auto">
    <header class="text-center mb-10">
      <h1 class="text-4xl font-black text-slate-800 tracking-tighter italic">F.O.KIDS <span class="text-indigo-600">STYLE MAKER</span></h1>
      <p class="text-slate-500 mt-2 font-medium tracking-wide">4-6歳 (110cm) 高精度全身コーディネート生成</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <div class="lg:col-span-5 space-y-6">
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-bold text-slate-800 mb-6 flex items-center">
            <span class="bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs mr-2 font-mono">1</span>
            アイテムをドロップ
          </h2>
          
          <div class="grid grid-cols-1 gap-4">
            <div>
              <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1 tracking-widest">Cap / Accessories</label>
              <div id="dropZoneHat" class="drop-zone">
                <p class="text-xs text-slate-400">帽子をドロップ</p>
                <input type="file" id="hatInput" class="hidden" accept="image/*">
                <img id="previewHat" class="preview-img hidden">
              </div>
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1 tracking-widest">Tops</label>
              <div id="dropZoneTop" class="drop-zone">
                <p class="text-xs text-slate-400">トップスをドロップ</p>
                <input type="file" id="topInput" class="hidden" accept="image/*">
                <img id="previewTop" class="preview-img hidden">
              </div>
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1 tracking-widest">Bottoms</label>
              <div id="dropZoneBottom" class="drop-zone">
                <p class="text-xs text-slate-400">ボトムスをドロップ</p>
                <input type="file" id="bottomInput" class="hidden" accept="image/*">
                <img id="previewBottom" class="preview-img hidden">
              </div>
            </div>
          </div>

          <div class="mt-8 pt-6 border-t border-slate-100">
            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-3 ml-1 tracking-widest">Model Race</label>
            <div class="radio-group grid grid-cols-3 gap-2 mb-8">
              <input type="radio" name="race" id="race1" value="Japanese" checked class="hidden">
              <label for="race1">日本人</label>
              <input type="radio" name="race" id="race2" value="half-Caucasian, half-Japanese" class="hidden">
              <label for="race2">ハーフ</label>
              <input type="radio" name="race" id="race3" value="Caucasian" class="hidden">
              <label for="race3">欧米系</label>
            </div>
            
            <button id="generateBtn" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black text-lg hover:bg-indigo-600 transition-all shadow-xl active:scale-[0.98] disabled:opacity-50">
              着画を生成する
            </button>
          </div>
        </div>
      </div>

      <div class="lg:col-span-7">
        <div id="resultCard" class="bg-white p-2 rounded-3xl shadow-sm border border-slate-200 flex flex-col items-center justify-center min-h-[600px] relative overflow-hidden">
          
          <div id="placeholder" class="text-center p-12">
            <div class="w-24 h-24 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-6">
              <svg class="w-12 h-12 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            </div>
            <p class="text-slate-400 font-bold tracking-widest text-sm uppercase">Waiting for design...</p>
          </div>

          <div id="loading" class="hidden text-center p-8 w-full max-w-sm">
            <div class="inline-block animate-spin rounded-full h-14 w-14 border-[6px] border-indigo-500 border-t-transparent mb-8"></div>
            <p id="statusLabel" class="font-black text-slate-800 text-xl mb-4">ベースモデルを生成中</p>
            
            <div class="flex justify-center items-center gap-4 mt-6">
              <div id="dot0" class="step-dot"></div>
              <div class="w-4 h-[2px] bg-slate-100"></div>
              <div id="dot1" class="step-dot"></div>
              <div class="w-4 h-[2px] bg-slate-100"></div>
              <div id="dot2" class="step-dot"></div>
              <div class="w-4 h-[2px] bg-slate-100"></div>
              <div id="dot3" class="step-dot"></div>
            </div>
            <p class="text-slate-400 text-[10px] mt-6 tracking-[0.2em] font-bold uppercase">Processing Steps</p>
          </div>

          <img id="resultImg" class="hidden w-full h-auto rounded-2xl">
          
          <button id="downloadBtn" class="hidden absolute bottom-8 right-8 bg-white/90 backdrop-blur shadow-2xl p-5 rounded-full border border-slate-100 text-slate-800 hover:scale-110 transition-transform active:scale-95">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = { hat: null, top: null, bottom: null };

    // ブラウザの画像表示を完全無効化
    window.addEventListener("dragover", e => e.preventDefault(), false);
    window.addEventListener("drop", e => e.preventDefault(), false);

    function setupUpload(inputId, dropId, previewId, key) {
      const input = document.getElementById(inputId), drop = document.getElementById(dropId), preview = document.getElementById(previewId);
      const handleFile = (file) => {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => { 
          state[key] = e.target.result; 
          preview.src = e.target.result; 
          preview.classList.remove('hidden'); 
          drop.classList.add('border-indigo-400'); 
        };
        reader.readAsDataURL(file);
      };
      drop.onclick = () => input.click();
      input.onchange = e => handleFile(e.target.files[0]);
      drop.ondragover = e => { e.preventDefault(); drop.classList.add('drag-over'); };
      drop.ondragleave = () => drop.classList.remove('drag-over');
      drop.ondrop = e => { e.preventDefault(); drop.classList.remove('drag-over'); handleFile(e.dataTransfer.files[0]); };
    }

    setupUpload('hatInput', 'dropZoneHat', 'previewHat', 'hat');
    setupUpload('topInput', 'dropZoneTop', 'previewTop', 'top');
    setupUpload('bottomInput', 'dropZoneBottom', 'previewBottom', 'bottom');

    const generateBtn = document.getElementById('generateBtn'), loading = document.getElementById('loading'), placeholder = document.getElementById('placeholder'), resultImg = document.getElementById('resultImg'), statusLabel = document.getElementById('statusLabel'), downloadBtn = document.getElementById('downloadBtn');

    function updateDots(stepIndex) {
      for(let i=0; i<=3; i++) {
        document.getElementById(`dot${i}`).classList.toggle('active', i === stepIndex);
      }
    }

    async function processSequentially(currentModel, tasks, totalTasks) {
      if (tasks.length === 0) {
        resultImg.src = currentModel;
        resultImg.classList.remove('hidden');
        loading.classList.add('hidden');
        downloadBtn.classList.remove('hidden');
        generateBtn.disabled = false;
        return;
      }

      const task = tasks.shift();
      const currentStep = totalTasks - tasks.length;
      updateDots(currentStep);
      statusLabel.innerText = `${task.label}を着用中...`;

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'start', modelImage: currentModel, productPreview: task.image, category: task.category })
        });
        const { jobId } = await res.json();

        const check = setInterval(async () => {
          const sRes = await fetch('/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'status', jobId }) });
          const sData = await sRes.json();
          if (sData.status === 'completed') {
            clearInterval(check);
            processSequentially(sData.output[0], tasks, totalTasks);
          } else if (sData.status === 'failed') {
            clearInterval(check);
            alert(`${task.label}の合成に失敗しました。`);
            location.reload();
          }
        }, 4000);
      } catch (e) {
        alert("エラーが発生しました。");
        location.reload();
      }
    }

    generateBtn.onclick = async () => {
      const race = document.querySelector('input[name="race"]:checked').value;
      placeholder.classList.add('hidden'); resultImg.classList.add('hidden'); downloadBtn.classList.add('hidden');
      loading.classList.remove('hidden'); generateBtn.disabled = true;
      
      updateDots(0);
      statusLabel.innerText = "110cmモデルを生成中...";

      try {
        // モデル生成
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'create_model', gender: 'boy', race: race, hasHat: !!state.hat, hasTop: !!state.top, hasBottom: !!state.bottom })
        });
        const { modelImage } = await res.json();

        // タスクリストの作成（★不自然さを消すための「ボトムス先」の順序）
        const tasks = [];
        if (state.bottom) tasks.push({ image: state.bottom, category: "bottoms", label: "ボトムス" });
        if (state.top) tasks.push({ image: state.top, category: "tops", label: "トップス" });
        if (state.hat) tasks.push({ image: state.hat, category: "accessories", label: "帽子" });

        const total = tasks.length;
        if (total === 0) {
          resultImg.src = modelImage; resultImg.classList.remove('hidden'); loading.classList.add('hidden'); generateBtn.disabled = false;
        } else {
          processSequentially(modelImage, tasks, total);
        }
      } catch (e) {
        alert("モデル生成に失敗しました。");
        generateBtn.disabled = false;
      }
    };

    downloadBtn.onclick = () => {
      const link = document.createElement('a');
      link.href = resultImg.src;
      link.download = `fokids-catalog-${Date.now()}.jpg`;
      link.click();
    };
  </script>
</body>
</html>
