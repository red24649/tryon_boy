<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>男児コーデ画像メーカー（プロトタイプ版）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style type="text/tailwindcss">
    body { font-family: 'Inter', -apple-system, sans-serif; }
    .drop-zone {
      @apply border-2 border-dashed border-blue-200 rounded-[2rem] p-4 text-center hover:bg-blue-50 hover:border-blue-400 transition-all cursor-pointer bg-white relative overflow-hidden min-h-[140px] flex flex-col items-center justify-center;
    }
    .preview-img { @apply absolute inset-0 w-full h-full object-contain p-2 bg-white; pointer-events: none; }
    .select-card { @apply border-2 border-slate-100 rounded-2xl p-4 cursor-pointer transition-all hover:bg-slate-50; }
    input[type="radio"]:checked + .select-card { @apply border-blue-600 bg-blue-50 shadow-sm ring-1 ring-blue-100; }
    .step-dot { @apply w-3 h-3 rounded-full bg-slate-200 transition-all duration-500; }
    .step-dot.active { @apply bg-blue-600 scale-150 shadow-lg; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen pb-20">
  <div class="max-w-6xl mx-auto px-6">
    <header class="py-12 flex justify-between items-end">
      <div>
        <h1 class="text-4xl font-black text-slate-900 tracking-tighter">&#x1f466; 男児コーデ画像メーカー</h1>
        <p class="text-sm text-gray-500">置き画から男児のコーデ画像を生成します(プロトタイプ版)</p>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
      <div class="lg:col-span-5 space-y-6">
        
        <section class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
          <h2 class="text-lg font-bold text-slate-800 mb-6">
            ① コーディネート登録
          </h2>
          <div class="grid grid-cols-4 gap-3">
            <div id="dropZoneHat" class="drop-zone">
              <span class="text-2xl mb-1"> </span>
              <span class="text-[10px] font-bold text-slate-500">帽子</span>
              <input type="file" id="hatInput" class="hidden" accept="image/*">
              <img id="previewHat" class="preview-img hidden">
            </div>
            <div id="dropZoneTop" class="drop-zone">
              <span class="text-2xl mb-1"> </span>
              <span class="text-[10px] font-bold text-slate-500">トップス</span>
              <input type="file" id="topInput" class="hidden" accept="image/*">
              <img id="previewTop" class="preview-img hidden">
            </div>
            <div id="dropZoneBottom" class="drop-zone">
              <span class="text-2xl mb-1"> </span>
              <span class="text-[10px] font-bold text-slate-500">ボトムス</span>
              <input type="file" id="bottomInput" class="hidden" accept="image/*">
              <img id="previewBottom" class="preview-img hidden">
            </div>
            <div id="dropZoneShoe" class="drop-zone">
              <span class="text-2xl mb-1"> </span>
              <span class="text-[10px] font-bold text-slate-500">靴</span>
              <input type="file" id="shoeInput" class="hidden" accept="image/*">
              <img id="previewShoe" class="preview-img hidden">
            </div>
          </div>
        </section>

        <section class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100 space-y-8">
          <div>
            <h2 class="text-lg font-bold text-slate-800 mb-4">
              ② ポーズ選択
            </h2>
            <div class="grid grid-cols-2 gap-3">
              <label><input type="radio" name="pose" value="natural_lean" class="hidden" checked><div class="select-card text-center text-xs font-bold">自然な立ち姿</div></label>
              <label><input type="radio" name="pose" value="walking_snapshot" class="hidden"><div class="select-card text-center text-xs font-bold">歩き出し</div></label>
              <label><input type="radio" name="pose" value="energetic_jump" class="hidden"><div class="select-card text-center text-xs font-bold">ジャンプ</div></label>
              <label><input type="radio" name="pose" value="looking_away" class="hidden"><div class="select-card text-center text-xs font-bold">目線外し</div></label>
            </div>
          </div>
          <div>
            <h2 class="text-lg font-bold text-slate-800 mb-4">
              ③ 表情
            </h2>
            <div class="grid grid-cols-3 gap-2">
              <label><input type="radio" name="expression" value="calm_relaxed" class="hidden" checked><div class="select-card text-center py-2 text-[10px] font-bold">リラックス</div></label>
              <label><input type="radio" name="expression" value="mischievous" class="hidden"><div class="select-card text-center py-2 text-[10px] font-bold">やんちゃ顔</div></label>
              <label><input type="radio" name="expression" value="beaming_smile" class="hidden"><div class="select-card text-center py-2 text-[10px] font-bold">はじける笑顔</div></label>
            </div>
          </div>
          <div>
            <h2 class="text-lg font-bold text-slate-800 mb-4">
              ④ 人種
            </h2>
            <div class="grid grid-cols-3 gap-2">
              <label><input type="radio" name="race" value="Japanese" class="hidden" checked><div class="select-card text-center py-2 text-[10px] font-bold">アジア系</div></label>
              <label><input type="radio" name="race" value="half-Caucasian, half-Japanese" class="hidden"><div class="select-card text-center py-2 text-[10px] font-bold">ハーフ系</div></label>
              <label><input type="radio" name="race" value="Caucasian" class="hidden"><div class="select-card text-center py-2 text-[10px] font-bold">欧米系</div></label>
            </div>
          </div>
        </section>

        <button id="generateBtn" class="w-full bg-blue-600 text-white py-6 rounded-[2rem] font-black text-lg hover:bg-blue-700 transition-all shadow-xl active:scale-95 disabled:opacity-50">
          &#x2728;　コーデ画像を生成する
        </button>
      </div>

      <div class="lg:col-span-7">
        <div id="resultCard" class="bg-white p-3 rounded-[3rem] shadow-sm border border-slate-200 flex flex-col items-center justify-center min-h-[720px] relative">
          <div id="loading" class="hidden text-center z-10 px-10">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent mb-8"></div>
            <p id="statusLabel" class="font-black text-slate-900 text-2xl tracking-tighter">AI RENDERING...</p>
            <div class="flex justify-center gap-4 mt-8"><div id="dot0" class="step-dot"></div><div id="dot1" class="step-dot"></div><div id="dot2" class="step-dot"></div><div id="dot3" class="step-dot"></div><div id="dot4" class="step-dot"></div></div>
          </div>
          <div class="w-full relative overflow-hidden rounded-[2.5rem]">
            <img id="resultImg" class="hidden w-full h-auto">
            <div id="placeholder" class="text-slate-300 font-bold uppercase tracking-widest text-xs italic">Waiting for styles</div>
            <button id="downloadBtn" class="hidden absolute bottom-10 right-10 bg-white shadow-lg p-6 rounded-full border border-slate-100 text-slate-900"> </button>
          </div>
          <div id="previewActions" class="hidden w-full mt-6 flex flex-wrap gap-3 items-center justify-center bg-white px-5 py-4 rounded-[2rem] shadow-sm border border-slate-100">
            <span class="text-xs font-bold text-amber-600 bg-amber-50 px-3 py-1.5 rounded-full">プレビュー（低解像度）</span>
            <button id="confirmBtn" class="bg-blue-600 text-white px-5 py-2.5 rounded-full font-bold text-sm hover:bg-blue-700">この内容で高画質生成</button>
            <button id="redoBtn" class="bg-slate-100 text-slate-600 px-5 py-2.5 rounded-full font-bold text-sm hover:bg-slate-200">やり直す</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = { hat: null, top: null, bottom: null, shoe: null };

    window.addEventListener("dragover", e => e.preventDefault(), false);
    window.addEventListener("drop", e => e.preventDefault(), false);

    function setupUpload(inputId, dropId, previewId, key) {
      const input = document.getElementById(inputId), drop = document.getElementById(dropId), preview = document.getElementById(previewId);
      const handleFile = (file) => {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => { state[key] = e.target.result; preview.src = e.target.result; preview.classList.remove('hidden'); };
        reader.readAsDataURL(file);
      };
      drop.onclick = () => input.click();
      input.onchange = e => handleFile(e.target.files[0]);
      drop.ondrop = e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); };
    }
    setupUpload('hatInput', 'dropZoneHat', 'previewHat', 'hat');
    setupUpload('topInput', 'dropZoneTop', 'previewTop', 'top');
    setupUpload('bottomInput', 'dropZoneBottom', 'previewBottom', 'bottom');
    setupUpload('shoeInput', 'dropZoneShoe', 'previewShoe', 'shoe');

    const generateBtn = document.getElementById('generateBtn'), statusLabel = document.getElementById('statusLabel'), resultImg = document.getElementById('resultImg'), loading = document.getElementById('loading');
    // プレビュー結果から本生成に進む際に再利用するための保存領域
    let lastBaseModel = null, lastTasks = [], lastPose = null;

    async function processSequentially(currentModel, tasks, total, selectedPose, previewMode) {
      if (tasks.length === 0) {
        resultImg.src = currentModel; resultImg.classList.remove('hidden'); loading.classList.add('hidden');
        if (previewMode) {
          // プレビュー完了：本生成ボタン・やり直しボタンを表示し、ダウンロードは不可にする
          document.getElementById('previewActions').classList.remove('hidden');
          document.getElementById('downloadBtn').classList.add('hidden');
        } else {
          // 本生成完了：ダウンロード可能にする
          document.getElementById('previewActions').classList.add('hidden');
          document.getElementById('downloadBtn').classList.remove('hidden');
          generateBtn.disabled = false;
        }
        return;
      }
      const task = tasks.shift();
      const currentStep = total - tasks.length;
      document.querySelectorAll('.step-dot').forEach((d, i) => d.classList.toggle('active', i === currentStep));
      statusLabel.innerText = previewMode ? `${task.label}をプレビュー合成中` : `${task.label}を高画質合成中`;

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'start', modelImage: currentModel, productPreview: task.image, category: task.category, pose: selectedPose, previewMode: !!previewMode })
        });
        const { jobId } = await res.json();

        let attempts = 0;
        const maxAttempts = 60; // 最大240秒（4秒×60回）待機（quality + 4k生成モードは処理時間が伸びるため）

        const timer = setInterval(async () => {
          attempts++;
          
          if (attempts > maxAttempts) {
            clearInterval(timer);
            alert(`${task.label}の合成がタイムアウトしました。サーバーが混雑している可能性があります。`);
            loading.classList.add('hidden');
            generateBtn.disabled = false;
            document.getElementById('placeholder').classList.remove('hidden');
            return;
          }

          try {
            const sRes = await fetch('/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'status', jobId }) });
            const sData = await sRes.json();
            
            if (sData.status === 'completed') {
              clearInterval(timer);
              processSequentially(sData.output[0], tasks, total, selectedPose, previewMode);
            } else if (sData.status === 'failed') { 
              clearInterval(timer); 
              alert("合成に失敗しました。画像を変えて再度お試しください。"); 
              loading.classList.add('hidden');
              generateBtn.disabled = false;
              document.getElementById('placeholder').classList.remove('hidden');
            }
          } catch (e) {
            console.warn("ステータス確認中に一時的なエラーが発生しました。リトライします...", e);
          }
        }, 4000);

      } catch (e) {
        alert("サーバーとの通信に失敗しました。");
        loading.classList.add('hidden');
        generateBtn.disabled = false;
        document.getElementById('placeholder').classList.remove('hidden');
      }
    }

    generateBtn.onclick = async () => {
      const pose = document.querySelector('input[name="pose"]:checked').value;
      const expression = document.querySelector('input[name="expression"]:checked').value;
      const race = document.querySelector('input[name="race"]:checked').value;
      document.getElementById('placeholder').classList.add('hidden'); resultImg.classList.add('hidden'); loading.classList.remove('hidden'); generateBtn.disabled = true;
      document.getElementById('previewActions').classList.add('hidden'); document.getElementById('downloadBtn').classList.add('hidden');
      document.querySelectorAll('.step-dot').forEach((d, i) => d.classList.toggle('active', i === 0));
      statusLabel.innerText = "ベースモデル(影・物理補正)生成中";

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'create_model', pose, expression, race, hasHat: !!state.hat, hasTop: !!state.top, hasBottom: !!state.bottom, hasShoe: !!state.shoe })
        });
        const { modelImage } = await res.json();
        const tasks = [];
        if (state.bottom) tasks.push({ image: state.bottom, category: "bottoms", label: "ボトムス" });
        if (state.top) tasks.push({ image: state.top, category: "tops", label: "トップス" });
        if (state.shoe) tasks.push({ image: state.shoe, category: "shoes", label: "靴" });
        if (state.hat) tasks.push({ image: state.hat, category: "accessories", label: "帽子" });

        // 本生成に進む際に再利用できるよう保存（プレビュー用にshiftで消費されるためコピーを保存）
        lastBaseModel = modelImage; lastTasks = tasks.slice(); lastPose = pose;

        if (tasks.length === 0) {
            // 着せ替えアイテムがない場合はプレビューの意味がないため、そのまま結果表示
            resultImg.src = modelImage; resultImg.classList.remove('hidden'); loading.classList.add('hidden'); generateBtn.disabled = false;
            document.getElementById('downloadBtn').classList.remove('hidden');
        } else {
            processSequentially(modelImage, tasks.slice(), tasks.length, pose, true);
        }
      } catch (e) { 
        alert("エラーが発生しました。"); 
        generateBtn.disabled = false; 
        loading.classList.add('hidden'); 
        document.getElementById('placeholder').classList.remove('hidden');
      }
    };

    document.getElementById('confirmBtn').onclick = () => {
      if (!lastBaseModel || lastTasks.length === 0) return;
      document.getElementById('previewActions').classList.add('hidden');
      resultImg.classList.add('hidden'); loading.classList.remove('hidden'); generateBtn.disabled = true;
      document.querySelectorAll('.step-dot').forEach((d, i) => d.classList.toggle('active', i === 0));
      statusLabel.innerText = "高画質で本生成を開始します";
      // 保存しておいたベースモデルとタスク一覧を使い、今度は本生成（quality + 4k）で実行
      processSequentially(lastBaseModel, lastTasks.slice(), lastTasks.length, lastPose, false);
    };

    document.getElementById('redoBtn').onclick = () => {
      // プレビューを破棄し、設定変更のために初期状態に戻す（アップロード済みアイテムは維持）
      document.getElementById('previewActions').classList.add('hidden');
      resultImg.classList.add('hidden');
      document.getElementById('placeholder').classList.remove('hidden');
      document.getElementById('downloadBtn').classList.add('hidden');
      generateBtn.disabled = false;
      lastBaseModel = null; lastTasks = []; lastPose = null;
    };
    
    document.getElementById('downloadBtn').onclick = async () => {
      try {
        const imageSrc = document.getElementById('resultImg').src;
        const response = await fetch(imageSrc);
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = `tryon_boy_${Date.now()}.jpg`;
        
        document.body.appendChild(a);
        a.click();
        
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
      } catch (err) {
        console.error("画像の保存に失敗しました", err);
      }
    };
  </script>
</body>
</html>
