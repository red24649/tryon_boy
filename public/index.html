<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>男児着画メーカー（プロトタイプ版）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style type="text/tailwindcss">
    body { font-family: 'Inter', -apple-system, sans-serif; }
    .drop-zone {
      @apply border-2 border-dashed border-[#EBE3DE] rounded-[2rem] p-4 text-center hover:bg-[#FFF0E8] hover:border-[#FF9868] transition-all cursor-pointer bg-white relative overflow-hidden min-h-[140px] flex flex-col items-center justify-center;
    }
    .preview-img { @apply absolute inset-0 w-full h-full object-contain p-2 bg-white; pointer-events: none; }
    .select-card { @apply border-2 border-[#F4EFEA] rounded-2xl p-4 cursor-pointer transition-all hover:bg-[#FAF6F3]; }
    input[type="radio"]:checked + .select-card { @apply border-[#FF9868] bg-[#FFF0E8] shadow-sm ring-1 ring-[#FFDBCB]; }
    .step-dot { @apply w-3 h-3 rounded-full bg-[#EBE3DE] transition-all duration-500; }
    .step-dot.active { @apply bg-[#FF9868] scale-150 shadow-lg; }
  </style>
</head>
<body class="bg-[#FFF9F4] min-h-screen pb-20 text-[#5A4D4A]">
  <div class="max-w-6xl mx-auto px-6">
    <header class="py-12 flex justify-between items-end">
      <div>
        <h1 class="text-4xl font-black text-[#5A4D4A] tracking-tighter">&#x1f466; 男児着画メーカー（プロトタイプ版） </h1>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
      <div class="lg:col-span-5 space-y-6">
        <section class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-[#F4EFEA]">
          <div class="grid grid-cols-3 gap-4">
            <div id="dropZoneHat" class="drop-zone">🧢<input type="file" id="hatInput" class="hidden" accept="image/*"><img id="previewHat" class="preview-img hidden"></div>
            <div id="dropZoneTop" class="drop-zone">👕<input type="file" id="topInput" class="hidden" accept="image/*"><img id="previewTop" class="preview-img hidden"></div>
            <div id="dropZoneBottom" class="drop-zone">👖<input type="file" id="bottomInput" class="hidden" accept="image/*"><img id="previewBottom" class="preview-img hidden"></div>
          </div>
        </section>

        <section class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-[#F4EFEA] space-y-6">
          <div>
            <p class="text-[10px] font-bold text-[#A89C9A] uppercase tracking-widest mb-3 ml-1">ポーズ選択</p>
            <div class="grid grid-cols-2 gap-3">
              <label><input type="radio" name="pose" value="natural_lean" class="hidden" checked><div class="select-card text-center text-xs font-bold">自然な立ち姿</div></label>
              <label><input type="radio" name="pose" value="walking_snapshot" class="hidden"><div class="select-card text-center text-xs font-bold">歩き出し</div></label>
              <label><input type="radio" name="pose" value="energetic_jump" class="hidden"><div class="select-card text-center text-xs font-bold">ジャンプ</div></label>
              <label><input type="radio" name="pose" value="looking_away" class="hidden"><div class="select-card text-center text-xs font-bold text-[#FF814A]">目線外し</div></label>
            </div>
          </div>
          <div>
            <p class="text-[10px] font-bold text-[#A89C9A] uppercase tracking-widest mb-3 ml-1">表情</p>
            <div class="grid grid-cols-3 gap-2">
              <label><input type="radio" name="expression" value="calm_relaxed" class="hidden"><div class="select-card text-center py-2 text-[10px] font-bold">リラックス</div></label>
              <label><input type="radio" name="expression" value="mischievous" class="hidden"><div class="select-card text-center py-2 text-[10px] font-bold">やんちゃ顔</div></label>
              <label><input type="radio" name="expression" value="beaming_smile" class="hidden" checked><div class="select-card text-center py-2 text-[10px] font-bold">はじける笑顔</div></label>
            </div>
          </div>
        </section>

        <button id="generateBtn" class="w-full bg-[#FF9868] text-white py-6 rounded-[2rem] font-black text-lg hover:bg-[#E8865A] transition-all shadow-2xl active:scale-95 disabled:opacity-50">
          &#x2728;　モデルと着画を生成する
        </button>
      </div>

      <div class="lg:col-span-7">
        <div id="resultCard" class="bg-white p-3 rounded-[3rem] shadow-2xl border border-[#EBE3DE] flex flex-col items-center justify-center min-h-[720px] relative overflow-hidden">
          <div id="loading" class="hidden text-center z-10 px-10">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-[#FF9868] border-t-transparent mb-8"></div>
            <p id="statusLabel" class="font-black text-[#5A4D4A] text-2xl tracking-tighter">AI RENDERING...</p>
            <div class="flex justify-center gap-4 mt-8"><div id="dot0" class="step-dot"></div><div id="dot1" class="step-dot"></div><div id="dot2" class="step-dot"></div><div id="dot3" class="step-dot"></div></div>
          </div>
          <img id="resultImg" class="hidden w-full h-auto rounded-[2.5rem]">
          <div id="placeholder" class="text-[#CFC4C2] font-bold uppercase tracking-widest text-xs italic">Waiting for styles</div>
          <button id="downloadBtn" class="hidden absolute bottom-10 right-10 bg-white shadow-2xl p-6 rounded-full border border-[#F4EFEA] text-[#5A4D4A]">💾</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = { hat: null, top: null, bottom: null };

    window.addEventListener("dragover", e => e.preventDefault(), false);
    window.addEventListener("drop", e => e.preventDefault(), false);

    function setupUpload(inputId, dropId, previewId, key) {
      const input = document.getElementById(inputId), drop = document.getElementById(dropId), preview = document.getElementById(previewId);
      const handleFile = (file) => {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => { state[key] = e.target.result; preview.src = e.target.result; preview.classList.remove('hidden'); };
        reader.readAsDataURL(file);
      };
      drop.onclick = () => input.click();
      input.onchange = e => handleFile(e.target.files[0]);
      drop.ondrop = e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); };
    }
    setupUpload('hatInput', 'dropZoneHat', 'previewHat', 'hat');
    setupUpload('topInput', 'dropZoneTop', 'previewTop', 'top');
    setupUpload('bottomInput', 'dropZoneBottom', 'previewBottom', 'bottom');

    const generateBtn = document.getElementById('generateBtn'), statusLabel = document.getElementById('statusLabel'), resultImg = document.getElementById('resultImg'), loading = document.getElementById('loading');

    async function processSequentially(currentModel, tasks, total, selectedPose) {
      if (tasks.length === 0) {
        resultImg.src = currentModel; resultImg.classList.remove('hidden'); loading.classList.add('hidden');
        document.getElementById('downloadBtn').classList.remove('hidden'); generateBtn.disabled = false;
        return;
      }
      const task = tasks.shift();
      const currentStep = total - tasks.length;
      document.querySelectorAll('.step-dot').forEach((d, i) => d.classList.toggle('active', i === currentStep));
      statusLabel.innerText = `${task.label}を合成中`;

      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'start', modelImage: currentModel, productPreview: task.image, category: task.category, pose: selectedPose })
      });
      const { jobId } = await res.json();

      const timer = setInterval(async () => {
        const sRes = await fetch('/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'status', jobId }) });
        const sData = await sRes.json();
        if (sData.status === 'completed') {
          clearInterval(timer);
          processSequentially(sData.output[0], tasks, total, selectedPose);
        } else if (sData.status === 'failed') { clearInterval(timer); alert("合成失敗"); location.reload(); }
      }, 4000);
    }

    generateBtn.onclick = async () => {
      const pose = document.querySelector('input[name="pose"]:checked').value;
      const expression = document.querySelector('input[name="expression"]:checked').value;
      document.getElementById('placeholder').classList.add('hidden'); resultImg.classList.add('hidden'); loading.classList.remove('hidden'); generateBtn.disabled = true;
      document.querySelectorAll('.step-dot').forEach((d, i) => d.classList.toggle('active', i === 0));
      statusLabel.innerText = "ベースモデル(影・物理補正)生成中";

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'create_model', pose, expression, hasHat: !!state.hat, hasTop: !!state.top, hasBottom: !!state.bottom })
        });
        const { modelImage } = await res.json();
        const tasks = [];
        if (state.bottom) tasks.push({ image: state.bottom, category: "bottoms", label: "ボトムス" });
        if (state.top) tasks.push({ image: state.top, category: "tops", label: "トップス" });
        if (state.hat) tasks.push({ image: state.hat, category: "accessories", label: "帽子" });
        
        if (tasks.length === 0) {
            resultImg.src = modelImage; resultImg.classList.remove('hidden'); loading.classList.add('hidden'); generateBtn.disabled = false;
        } else {
            processSequentially(modelImage, tasks, tasks.length, pose);
        }
      } catch (e) { alert("エラー"); generateBtn.disabled = false; loading.classList.add('hidden'); }
    };
    
    document.getElementById('downloadBtn').onclick = () => {
      const a = document.createElement('a');
      a.href = document.getElementById('resultImg').src;
      a.download = `fokids-v16-${Date.now()}.jpg`;
      a.click();
    };
  </script>
</body>
</html>
