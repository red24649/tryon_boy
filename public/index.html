<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>男児着画生成メーカー | F.O.KIDS Style</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style type="text/tailwindcss">
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .drop-zone {
      @apply border-2 border-dashed border-gray-300 rounded-2xl p-4 text-center hover:bg-indigo-50 hover:border-indigo-400 transition cursor-pointer bg-white relative overflow-hidden min-h-[140px] flex flex-col items-center justify-center;
      z-index: 10;
    }
    .drop-zone.drag-over {
      @apply border-indigo-600 bg-indigo-100 ring-4 ring-indigo-100 !important;
    }
    .drop-zone * { pointer-events: none; }
    .preview-img { 
      @apply absolute inset-0 w-full h-full object-contain p-2 bg-white;
      pointer-events: none;
    }
    .radio-group label {
      @apply border-2 border-gray-200 rounded-xl px-4 py-3 text-center cursor-pointer transition text-sm font-medium text-gray-700 bg-white hover:bg-gray-50;
      pointer-events: auto;
    }
    .radio-group input[type="radio"]:checked + label {
      @apply border-indigo-500 bg-indigo-50 text-indigo-700 font-bold;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 sm:p-8">
  <div class="max-w-5xl mx-auto">
    <header class="text-center mb-10">
      <h1 class="text-4xl font-black text-slate-800 tracking-tighter">男児着画生成メーカー</h1>
      <p class="text-slate-500 mt-2">4-6歳 (110cm) F.O.KIDS スタイル</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <div class="lg:col-span-5 space-y-6">
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-bold text-slate-800 mb-6 flex items-center">
            <span class="bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs mr-2 font-mono">1</span>
            アイテム選択（ドロップOK）
          </h2>
          <div class="grid grid-cols-1 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1 ml-1">🧢 帽子</label>
              <div id="dropZoneHat" class="drop-zone">
                <p class="text-xs text-slate-400">ドロップして追加</p>
                <input type="file" id="hatInput" class="hidden" accept="image/*">
                <img id="previewHat" class="preview-img hidden">
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1 ml-1">👕 トップス</label>
              <div id="dropZoneTop" class="drop-zone">
                <p class="text-xs text-slate-400">ドロップして追加</p>
                <input type="file" id="topInput" class="hidden" accept="image/*">
                <img id="previewTop" class="preview-img hidden">
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1 ml-1">👖 ボトムス</label>
              <div id="dropZoneBottom" class="drop-zone">
                <p class="text-xs text-slate-400">ドロップして追加</p>
                <input type="file" id="bottomInput" class="hidden" accept="image/*">
                <img id="previewBottom" class="preview-img hidden">
              </div>
            </div>
          </div>

          <div class="mt-8 pt-6 border-t border-slate-100">
            <span class="block text-xs font-bold text-slate-500 mb-3 ml-1">モデルタイプ</span>
            <div class="radio-group grid grid-cols-3 gap-2 mb-6">
              <input type="radio" name="race" id="race1" value="Japanese" checked class="hidden">
              <label for="race1">日本人</label>
              <input type="radio" name="race" id="race2" value="half-Caucasian, half-Japanese" class="hidden">
              <label for="race2">ハーフ</label>
              <input type="radio" name="race" id="race3" value="Caucasian" class="hidden">
              <label for="race3">欧米系</label>
            </div>
            <button id="generateBtn" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold text-lg hover:bg-indigo-600 transition-all shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
              着画を生成する
            </button>
          </div>
        </div>
      </div>

      <div class="lg:col-span-7">
        <div id="resultCard" class="bg-white p-2 rounded-3xl shadow-sm border border-slate-200 flex flex-col items-center justify-center min-h-[500px] relative overflow-hidden">
          
          <div id="placeholder" class="text-center p-8">
            <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4">
              <svg class="w-10 h-10 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            </div>
            <p class="text-slate-400 font-medium">コーディネートを組んで生成</p>
          </div>

          <div id="loading" class="hidden text-center p-8">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-indigo-500 border-t-transparent mb-4"></div>
            <p id="statusLabel" class="font-bold text-slate-800 text-lg">AIモデルを生成中...</p>
            <p class="text-slate-400 text-sm mt-2">これには最大1分ほどかかる場合があります</p>
          </div>

          <img id="resultImg" class="hidden w-full h-auto rounded-2xl shadow-inner">
          
          <button id="downloadBtn" class="hidden absolute bottom-6 right-6 bg-white shadow-xl p-4 rounded-full border border-slate-100 text-slate-700 hover:scale-110 transition-transform">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          </button>
        </div>

        <div id="errorBox" class="hidden mt-4 p-4 bg-red-50 border border-red-100 text-red-600 rounded-2xl text-sm text-center">
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = { hat: null, top: null, bottom: null };

    // ブラウザの画像表示機能を全体で禁止
    window.addEventListener("dragover", e => e.preventDefault(), false);
    window.addEventListener("drop", e => e.preventDefault(), false);

    function setupUpload(inputId, dropId, previewId, key) {
      const input = document.getElementById(inputId);
      const drop = document.getElementById(dropId);
      const preview = document.getElementById(previewId);

      const handleFile = (file) => {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          state[key] = e.target.result;
          preview.src = e.target.result;
          preview.classList.remove('hidden');
          drop.classList.add('border-indigo-400');
        };
        reader.readAsDataURL(file);
      };

      drop.addEventListener('click', () => input.click());
      input.addEventListener('change', e => handleFile(e.target.files[0]));

      drop.addEventListener('dragover', (e) => {
        e.preventDefault(); e.stopPropagation();
        drop.classList.add('drag-over');
      });
      drop.addEventListener('dragleave', (e) => {
        e.preventDefault(); e.stopPropagation();
        drop.classList.remove('drag-over');
      });
      drop.addEventListener('drop', (e) => {
        e.preventDefault(); e.stopPropagation();
        drop.classList.remove('drag-over');
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleFile(e.dataTransfer.files[0]);
        }
      });
    }

    setupUpload('hatInput', 'dropZoneHat', 'previewHat', 'hat');
    setupUpload('topInput', 'dropZoneTop', 'previewTop', 'top');
    setupUpload('bottomInput', 'dropZoneBottom', 'previewBottom', 'bottom');

    const generateBtn = document.getElementById('generateBtn');
    const loading = document.getElementById('loading');
    const placeholder = document.getElementById('placeholder');
    const resultImg = document.getElementById('resultImg');
    const statusLabel = document.getElementById('statusLabel');
    const errorBox = document.getElementById('errorBox');
    const downloadBtn = document.getElementById('downloadBtn');

    generateBtn.onclick = async () => {
      const race = document.querySelector('input[name="race"]:checked').value;
      
      // UIリセット
      placeholder.classList.add('hidden');
      resultImg.classList.add('hidden');
      downloadBtn.classList.add('hidden');
      errorBox.classList.add('hidden');
      loading.classList.remove('hidden');
      generateBtn.disabled = true;
      statusLabel.innerText = "AIモデル画像を生成中...";

      try {
        // 1. 生成開始リクエスト
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'start',
            hatImage: state.hat,
            topImage: state.top,
            bottomImage: state.bottom,
            gender: 'boy',
            race: race
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "生成の開始に失敗しました");

        const jobId = data.jobId;
        
        // 2. ポーリング（3秒ごとに状態確認）
        const checkStatus = setInterval(async () => {
          try {
            const sRes = await fetch('/api/generate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'status', jobId })
            });
            const sData = await sRes.json();

            if (sData.status === 'completed') {
              clearInterval(checkStatus);
              resultImg.src = sData.output[0];
              resultImg.classList.remove('hidden');
              loading.classList.add('hidden');
              downloadBtn.classList.remove('hidden');
              generateBtn.disabled = false;
            } else if (sData.status === 'failed') {
              clearInterval(checkStatus);
              throw new Error("AI合成に失敗しました。別の画像で試してください。");
            } else {
              statusLabel.innerText = "アイテムを合成中...";
            }
          } catch (err) {
            clearInterval(checkStatus);
            showError(err.message);
          }
        }, 3000);

      } catch (err) {
        showError(err.message);
      }
    };

    function showError(msg) {
      errorBox.innerText = "エラー: " + msg;
      errorBox.classList.remove('hidden');
      loading.classList.add('hidden');
      placeholder.classList.remove('hidden');
      generateBtn.disabled = false;
    }

    downloadBtn.onclick = () => {
      const a = document.createElement('a');
      a.href = resultImg.src;
      a.download = `fokids-coordinate-${Date.now()}.png`;
      a.click();
    };
  </script>
</body>
</html>
