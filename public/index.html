<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F.O.KIDS v10 | DEBUG MODE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style type="text/tailwindcss">
    body { font-family: 'Inter', -apple-system, sans-serif; }
    .drop-zone {
      @apply border-2 border-dashed border-slate-300 rounded-3xl p-4 text-center hover:bg-indigo-50 hover:border-indigo-400 transition-all cursor-pointer bg-white relative overflow-hidden min-h-[140px] flex flex-col items-center justify-center;
    }
    .preview-img { @apply absolute inset-0 w-full h-full object-contain p-2 bg-white; pointer-events: none; }
    .select-card { @apply border-2 border-slate-100 rounded-2xl p-4 cursor-pointer transition-all hover:bg-slate-50; }
    input[type="radio"]:checked + .select-card { @apply border-indigo-600 bg-indigo-50 shadow-sm ring-1 ring-indigo-100; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen pb-20">
  <div class="max-w-6xl mx-auto px-6">
    <header class="py-12 flex justify-between items-end">
      <div>
        <h1 class="text-4xl font-black text-slate-900 tracking-tighter italic underline decoration-red-500">DEBUG MODE</h1>
        <p class="text-slate-400 font-bold text-xs mt-2 uppercase tracking-[0.3em]">Pose & Expression Verification</p>
      </div>
      <p class="text-red-500 font-black text-sm uppercase animate-pulse">Try-on Bypassed</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
      <div class="lg:col-span-5 space-y-8">
        <section class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
          <div class="space-y-6">
            <div>
              <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 ml-1">Pose Selection</p>
              <div class="grid grid-cols-2 gap-3">
                <label><input type="radio" name="pose" value="natural_lean" class="hidden" checked><div class="select-card text-center"><p class="text-xs font-bold text-slate-800">自然な立ち姿</p></div></label>
                <label><input type="radio" name="pose" value="walking_snapshot" class="hidden"><div class="select-card text-center"><p class="text-xs font-bold text-slate-800">歩き出し</p></div></label>
                <label><input type="radio" name="pose" value="energetic_jump" class="hidden"><div class="select-card text-center"><p class="text-xs font-bold text-slate-800">ジャンプ</p></div></label>
                <label><input type="radio" name="pose" value="looking_away" class="hidden"><div class="select-card text-center"><p class="text-xs font-bold text-slate-800">目線外し</p></div></label>
              </div>
            </div>
            <div>
              <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 ml-1">Expression</p>
              <div class="grid grid-cols-3 gap-2">
                <label><input type="radio" name="expression" value="beaming_smile" class="hidden" checked><div class="select-card text-center py-2"><p class="text-[10px] font-bold text-slate-800">はじける笑顔</p></div></label>
                <label><input type="radio" name="expression" value="mischievous" class="hidden"><div class="select-card text-center py-2"><p class="text-[10px] font-bold text-slate-800">やんちゃ顔</p></div></label>
                <label><input type="radio" name="expression" value="calm_relaxed" class="hidden"><div class="select-card text-center py-2"><p class="text-[10px] font-bold text-slate-800">リラックス</p></div></label>
              </div>
            </div>
          </div>
        </section>

        <button id="generateBtn" class="w-full bg-red-600 text-white py-6 rounded-[2rem] font-black text-lg hover:bg-red-700 transition-all shadow-2xl active:scale-95">
          ポーズの精度を確認する
        </button>
      </div>

      <div class="lg:col-span-7">
        <div id="resultCard" class="bg-white p-3 rounded-[3rem] shadow-2xl border border-slate-200 flex flex-col items-center justify-center min-h-[720px] relative overflow-hidden">
          <div id="loading" class="hidden text-center">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-red-500 border-t-transparent mb-4"></div>
            <p class="font-black text-slate-900 text-xl tracking-tighter">Imagen 4.0 描画中...</p>
          </div>
          <img id="resultImg" class="hidden w-full h-auto rounded-[2.5rem]">
          <div id="placeholder" class="text-slate-300 font-bold uppercase tracking-widest text-xs">Verify Pose & Body Scale</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const generateBtn = document.getElementById('generateBtn');
    const resultImg = document.getElementById('resultImg');
    const loading = document.getElementById('loading');
    const placeholder = document.getElementById('placeholder');

    generateBtn.onclick = async () => {
      const pose = document.querySelector('input[name="pose"]:checked').value;
      const expression = document.querySelector('input[name="expression"]:checked').value;

      placeholder.classList.add('hidden');
      resultImg.classList.add('hidden');
      loading.classList.remove('hidden');
      generateBtn.disabled = true;

      try {
        // 1. モデル生成
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'create_model', pose, expression })
        });
        const { modelImage } = await res.json();

        // 2. デバッグバイパス（合成せず即座に表示）
        const startRes = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'start', modelImage })
        });
        const { debugImage } = await startRes.json();

        // 3. ステータス確認（デバッグ用即時完了）
        const statusRes = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'status', debugImage })
        });
        const sData = await statusRes.json();

        if (sData.status === 'completed') {
          resultImg.src = sData.output[0];
          resultImg.classList.remove('hidden');
          loading.classList.add('hidden');
          generateBtn.disabled = false;
        }
      } catch (e) {
        alert("生成エラー");
        generateBtn.disabled = false;
        loading.classList.add('hidden');
      }
    };
  </script>
</body>
</html>
