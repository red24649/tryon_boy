<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>男児着画生成メーカー | F.O.KIDS Style</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style type="text/tailwindcss">
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .drop-zone {
      @apply border-2 border-dashed border-gray-300 rounded-2xl p-4 text-center hover:bg-indigo-50 hover:border-indigo-400 transition cursor-pointer bg-white relative overflow-hidden min-h-[140px] flex flex-col items-center justify-center;
      z-index: 10;
    }
    .drop-zone.drag-over { @apply border-indigo-600 bg-indigo-100 ring-4 ring-indigo-100 !important; }
    .drop-zone * { pointer-events: none; }
    .preview-img { @apply absolute inset-0 w-full h-full object-contain p-2 bg-white; pointer-events: none; }
    .radio-group label { @apply border-2 border-gray-200 rounded-xl px-4 py-3 text-center cursor-pointer transition text-sm font-medium text-gray-700 bg-white hover:bg-gray-50; pointer-events: auto; }
    .radio-group input[type="radio"]:checked + label { @apply border-indigo-500 bg-indigo-50 text-indigo-700 font-bold; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 sm:p-8">
  <div class="max-w-5xl mx-auto">
    <header class="text-center mb-10">
      <h1 class="text-4xl font-black text-slate-800 tracking-tighter">男児着画生成メーカー</h1>
      <p class="text-slate-500 mt-2 font-medium">4-6歳 (110cm) 3ステップ自動合成システム</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <div class="lg:col-span-5 space-y-6">
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-bold text-slate-800 mb-6 flex items-center"><span class="bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs mr-2 font-mono">1</span>アイテム選択</h2>
          <div class="grid grid-cols-1 gap-4">
            <div id="dropZoneHat" class="drop-zone"><p class="text-xs text-slate-400">🧢 帽子をドロップ</p><input type="file" id="hatInput" class="hidden" accept="image/*"><img id="previewHat" class="preview-img hidden"></div>
            <div id="dropZoneTop" class="drop-zone"><p class="text-xs text-slate-400">👕 トップスをドロップ</p><input type="file" id="topInput" class="hidden" accept="image/*"><img id="previewTop" class="preview-img hidden"></div>
            <div id="dropZoneBottom" class="drop-zone"><p class="text-xs text-slate-400">👖 ボトムスをドロップ</p><input type="file" id="bottomInput" class="hidden" accept="image/*"><img id="previewBottom" class="preview-img hidden"></div>
          </div>
          <div class="mt-8 pt-6 border-t">
            <div class="radio-group grid grid-cols-3 gap-2 mb-6">
              <input type="radio" name="race" id="race1" value="Japanese" checked class="hidden"><label for="race1">日本人</label>
              <input type="radio" name="race" id="race2" value="half-Caucasian, half-Japanese" class="hidden"><label for="race2">ハーフ</label>
              <input type="radio" name="race" id="race3" value="Caucasian" class="hidden"><label for="race3">欧米系</label>
            </div>
            <button id="generateBtn" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-indigo-600 transition shadow-lg disabled:opacity-50">全身コーデを生成</button>
          </div>
        </div>
      </div>

      <div class="lg:col-span-7">
        <div id="resultCard" class="bg-white p-2 rounded-3xl shadow-sm border border-slate-200 flex flex-col items-center justify-center min-h-[500px] relative overflow-hidden">
          <div id="placeholder" class="text-center p-8"><p class="text-slate-400">生成された画像がここに表示されます</p></div>
          <div id="loading" class="hidden text-center p-8">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-indigo-500 border-t-transparent mb-4"></div>
            <p id="statusLabel" class="font-bold text-slate-800 text-lg">AIモデルを生成中...</p>
            <div id="progressSteps" class="mt-4 flex gap-2 justify-center"></div>
          </div>
          <img id="resultImg" class="hidden w-full h-auto rounded-2xl">
          <button id="downloadBtn" class="hidden absolute bottom-6 right-6 bg-white shadow-xl p-4 rounded-full border border-slate-100 text-slate-700">💾</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = { hat: null, top: null, bottom: null };

    window.addEventListener("dragover", e => e.preventDefault(), false);
    window.addEventListener("drop", e => e.preventDefault(), false);

    function setupUpload(inputId, dropId, previewId, key) {
      const input = document.getElementById(inputId), drop = document.getElementById(dropId), preview = document.getElementById(previewId);
      const handleFile = (file) => {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => { state[key] = e.target.result; preview.src = e.target.result; preview.classList.remove('hidden'); drop.classList.add('border-indigo-400'); };
        reader.readAsDataURL(file);
      };
      drop.onclick = () => input.click();
      input.onchange = e => handleFile(e.target.files[0]);
      drop.ondragover = e => { e.preventDefault(); drop.classList.add('drag-over'); };
      drop.ondragleave = () => drop.classList.remove('drag-over');
      drop.ondrop = e => { e.preventDefault(); drop.classList.remove('drag-over'); handleFile(e.dataTransfer.files[0]); };
    }

    setupUpload('hatInput', 'dropZoneHat', 'previewHat', 'hat');
    setupUpload('topInput', 'dropZoneTop', 'previewTop', 'top');
    setupUpload('bottomInput', 'dropZoneBottom', 'previewBottom', 'bottom');

    const generateBtn = document.getElementById('generateBtn'), loading = document.getElementById('loading'), placeholder = document.getElementById('placeholder'), resultImg = document.getElementById('resultImg'), statusLabel = document.getElementById('statusLabel');

    async function processSequentially(currentModel, tasks) {
      if (tasks.length === 0) {
        resultImg.src = currentModel; resultImg.classList.remove('hidden'); loading.classList.add('hidden'); generateBtn.disabled = false;
        return;
      }
      const task = tasks.shift();
      statusLabel.innerText = `${task.label}を合成中...`;

      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'start', modelImage: currentModel, productPreview: task.image, category: task.category })
      });
      const { jobId } = await res.json();

      const check = setInterval(async () => {
        const sRes = await fetch('/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'status', jobId }) });
        const sData = await sRes.json();
        if (sData.status === 'completed') {
          clearInterval(check);
          processSequentially(sData.output[0], tasks);
        } else if (sData.status === 'failed') {
          clearInterval(check); alert('合成に失敗しました'); location.reload();
        }
      }, 4000);
    }

    generateBtn.onclick = async () => {
      const race = document.querySelector('input[name="race"]:checked').value;
      placeholder.classList.add('hidden'); resultImg.classList.add('hidden'); loading.classList.remove('hidden'); generateBtn.disabled = true;
      statusLabel.innerText = "110cmモデルを生成中...";

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'create_model', gender: 'boy', race: race, hasHat: !!state.hat, hasTop: !!state.top, hasBottom: !!state.bottom })
        });
        const { modelImage } = await res.json();

        const tasks = [];
        if (state.top) tasks.push({ image: state.top, category: "tops", label: "トップス" });
        if (state.bottom) tasks.push({ image: state.bottom, category: "bottoms", label: "ボトムス" });
        if (state.hat) tasks.push({ image: state.hat, category: "accessories", label: "帽子" });

        if (tasks.length === 0) {
          resultImg.src = modelImage; resultImg.classList.remove('hidden'); loading.classList.add('hidden'); generateBtn.disabled = false;
        } else {
          processSequentially(modelImage, tasks);
        }
      } catch (e) { alert('モデル生成エラー'); generateBtn.disabled = false; }
    };
  </script>
</body>
</html>
